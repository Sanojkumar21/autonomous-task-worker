<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Acme{% endblock %}</title>
<style>
 body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f6f7f9;color:#1d2330}
 header{background:{% block brand_color %}#243b6b{% endblock %};color:#fff;padding:12px 24px;display:flex;gap:24px;align-items:center}
 header a{color:#fff;text-decoration:none;font-weight:500} header .brand{font-size:18px;font-weight:700}
 main{max-width:960px;margin:24px auto;background:#fff;padding:24px 32px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
 table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e5e8ee} th{background:#f0f2f6}
 label{display:block;margin:12px 0 4px;font-weight:600} input,select,textarea{padding:7px 9px;border:1px solid #c7cdd8;border-radius:4px;font-size:14px;min-width:260px}
 button,.btn{padding:8px 14px;border-radius:4px;border:1px solid #243b6b;background:#243b6b;color:#fff;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
 .btn.secondary,button.secondary{background:#fff;color:#243b6b}
 .flash{background:#e6f6ea;border:1px solid #9bd3ab;padding:10px 14px;border-radius:4px;margin-bottom:16px}
 .error{color:#b3261e;font-size:13px} .warn{background:#fff6e0;border:1px solid #f0cf7a;padding:10px 14px;border-radius:4px;margin-bottom:16px}
 .muted{color:#667085;font-size:13px} .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f6}
 .pill.open,.pill.posted,.pill.recorded{background:#e6f6ea} .pill.superseded,.pill.parked{background:#fdecec} .pill.draft{background:#fff6e0}
 .actions{margin-top:20px;display:flex;gap:10px} dl{display:grid;grid-template-columns:200px 1fr;gap:6px 12px} dt{font-weight:600}
</style>
</head>
<body>
<header>
 <span class="brand">{% block brand %}Acme{% endblock %}</span>
 {% block nav %}{% endblock %}
 <span style="margin-left:auto" class="muted" style="color:#fff">{% if user %}Signed in as {{ user }}{% endif %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
